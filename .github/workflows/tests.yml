name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Float16Array, used as the f16 conversion oracle

      # tokenizer.json is 7 MB, so the corpus gate -- 3098 cases against ids
      # produced by the reference Rust tokenizer -- runs here rather than
      # skipping. Pinned to a revision, so a change upstream cannot quietly
      # invalidate golden/tokenizer_cases.json without the build noticing.
      - name: Fetch the tokenizer
        env:
          REV: 7ae557604adf67be50417f59c2c2f167def9a775
        run: |
          mkdir -p weights
          curl -sSLf -o weights/tokenizer.json \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/$REV/tokenizer.json"
          test "$(sha256sum weights/tokenizer.json | cut -c1-20)" = "c0382117ea329cdf0970"

      # The 988 MB of weights are not worth a gigabyte per push, so the single
      # test that needs them skips. Everything else runs: the exhaustive float
      # conversions, the safetensors header validation, the byte-level
      # alphabet, and the full tokenizer corpus.
      - run: node --test
