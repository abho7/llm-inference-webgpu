<!doctype html>
<meta charset="utf-8">
<title>WebGPU probe</title>
<style>
  body { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         margin: 2rem; max-width: 60rem; }
  h1 { font-size: 1.1rem; }
  table { border-collapse: collapse; margin: 1rem 0; }
  td { padding: 0.15rem 1.5rem 0.15rem 0; vertical-align: top; }
  td:first-child { color: #666; }
  .bad { color: #b00; }
  .good { color: #070; }
  pre { white-space: pre-wrap; }
</style>
<h1>WebGPU probe</h1>
<p>What this adapter actually supports, and whether a compute shader gets the
right answer on it. Everything phase 3 assumes is checked here first.</p>
<div id="out">running...</div>

<script type="module">
const out = document.getElementById('out');
const report = { ok: false };

function render(html) { out.innerHTML = html; }
function rows(pairs) {
  return `<table>${pairs.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`;
}

try {
  if (!navigator.gpu) throw new Error('navigator.gpu is undefined: no WebGPU in this browser');

  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) throw new Error('requestAdapter returned null');

  const info = adapter.info ?? {};
  const features = [...adapter.features].sort();
  const limits = adapter.limits;

  // Ask for the features the engine wants, but only those the adapter has, so
  // a missing one degrades rather than throwing.
  const wanted = ['shader-f16', 'subgroups', 'timestamp-query'];
  const requested = wanted.filter((f) => adapter.features.has(f));
  const device = await adapter.requestDevice({ requiredFeatures: requested });

  // A compute shader whose answer is known in advance. The point is not that
  // WebGPU exists but that it computes correctly on this driver.
  const N = 1 << 20;
  const module = device.createShaderModule({
    code: `
      @group(0) @binding(0) var<storage, read>       input : array<f32>;
      @group(0) @binding(1) var<storage, read_write> output: array<f32>;
      @compute @workgroup_size(256)
      fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
        let i = gid.x;
        if (i >= arrayLength(&input)) { return; }
        output[i] = input[i] * 2.0 + 1.0;
      }`,
  });

  const source = new Float32Array(N);
  for (let i = 0; i < N; i++) source[i] = i % 1000;

  const inBuf = device.createBuffer({
    size: source.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(inBuf, 0, source);
  const outBuf = device.createBuffer({
    size: source.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
  });
  const readBuf = device.createBuffer({
    size: source.byteLength, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
  });

  const pipeline = device.createComputePipeline({
    layout: 'auto',
    compute: { module, entryPoint: 'main' },
  });
  const bind = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: inBuf } },
      { binding: 1, resource: { buffer: outBuf } },
    ],
  });

  const started = performance.now();
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bind);
  pass.dispatchWorkgroups(Math.ceil(N / 256));
  pass.end();
  encoder.copyBufferToBuffer(outBuf, 0, readBuf, 0, source.byteLength);
  device.queue.submit([encoder.finish()]);
  await device.queue.onSubmittedWorkDone();
  const elapsed = performance.now() - started;

  await readBuf.mapAsync(GPUMapMode.READ);
  const got = new Float32Array(readBuf.getMappedRange().slice(0));
  readBuf.unmap();

  let wrong = 0;
  let firstWrong = -1;
  for (let i = 0; i < N; i++) {
    const expected = (i % 1000) * 2 + 1;
    if (got[i] !== expected) {
      wrong++;
      if (firstWrong < 0) firstWrong = i;
    }
  }

  report.ok = wrong === 0;
  report.adapter = { ...info };
  report.features = features;
  report.requested = requested;
  report.wrong = wrong;
  report.elapsedMs = elapsed;
  report.limits = {};
  for (const key of [
    'maxStorageBufferBindingSize', 'maxBufferSize', 'maxComputeWorkgroupStorageSize',
    'maxComputeInvocationsPerWorkgroup', 'maxComputeWorkgroupSizeX',
    'maxStorageBuffersPerShaderStage', 'maxBindGroups', 'maxComputeWorkgroupsPerDimension',
    'maxUniformBufferBindingSize',
  ]) report.limits[key] = limits[key];

  const mib = (n) => `${(n / 1024 / 1024).toFixed(0)} MiB`;
  render(`
    ${rows([
      ['vendor', info.vendor ?? '(not reported)'],
      ['architecture', info.architecture ?? '(not reported)'],
      ['device', info.device ?? '(not reported)'],
      ['description', info.description ?? '(not reported)'],
    ])}
    <b>features</b>
    ${rows(wanted.map((f) => [f, adapter.features.has(f)
      ? '<span class="good">available</span>'
      : '<span class="bad">missing</span>']))}
    <b>limits that constrain the design</b>
    ${rows([
      ['maxStorageBufferBindingSize', `${report.limits.maxStorageBufferBindingSize} (${mib(report.limits.maxStorageBufferBindingSize)})`],
      ['maxBufferSize', `${report.limits.maxBufferSize} (${mib(report.limits.maxBufferSize)})`],
      ['maxComputeWorkgroupStorageSize', `${report.limits.maxComputeWorkgroupStorageSize} bytes`],
      ['maxComputeInvocationsPerWorkgroup', report.limits.maxComputeInvocationsPerWorkgroup],
      ['maxStorageBuffersPerShaderStage', report.limits.maxStorageBuffersPerShaderStage],
      ['maxComputeWorkgroupsPerDimension', report.limits.maxComputeWorkgroupsPerDimension],
    ])}
    <b>correctness</b>
    ${rows([
      ['elements', N.toLocaleString()],
      ['wrong', wrong === 0
        ? '<span class="good">0 &mdash; every element matched</span>'
        : `<span class="bad">${wrong}, first at ${firstWrong}</span>`],
      ['round trip', `${elapsed.toFixed(2)} ms`],
    ])}
    <b>all features reported</b>
    <pre>${features.join(', ')}</pre>
  `);
} catch (error) {
  report.error = String(error);
  render(`<p class="bad">${String(error)}</p>`);
}

// Left where the automation can read it without scraping the rendering.
window.__probe = report;
document.title = report.ok ? 'WebGPU probe: ok' : 'WebGPU probe: FAILED';
</script>
